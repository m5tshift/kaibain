name: macOS and Windows checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.os }} / Python 3.14
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m playwright install chromium
      - run: python tests/browser_check.py
        env:
          PLAYWRIGHT_CHANNEL: ''
      - run: python tests/browser_projects_check.py
        env:
          PLAYWRIGHT_CHANNEL: ''
      - run: python tests/browser_readiness_check.py
        env:
          PLAYWRIGHT_CHANNEL: ''
      - run: python tests/browser_dialogue_check.py
        env:
          PLAYWRIGHT_CHANNEL: ''
      - run: python tests/browser_result_review_check.py
        env:
          PLAYWRIGHT_CHANNEL: ''
      - run: python tests/browser_agent_graph_check.py
        env:
          PLAYWRIGHT_CHANNEL: ''
      - run: python tests/browser_recovery_check.py
        env:
          PLAYWRIGHT_CHANNEL: ''
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ matrix.os }}
          path: test-results/*.png
          if-no-files-found: ignore
